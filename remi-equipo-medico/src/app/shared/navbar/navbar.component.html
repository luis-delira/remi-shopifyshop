<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="container nav__inner">
    <a routerLink="/" class="nav__brand" (click)="closeMenu()">
      <span class="nav__mark">R</span>
      <span class="nav__brand-text">
        REMI <strong>Equipo Médico</strong>
      </span>
    </a>

    <nav class="nav__links" [class.open]="menuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
      <a routerLink="/contacto" class="btn btn-accent btn-sm nav__cta" (click)="closeMenu()">
        Solicitar cotización
      </a>
    </nav>

    <button
      class="nav__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
